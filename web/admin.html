<!DOCTYPE html>
<html>
<head>

<title>Admin Login - LIXAFA PROJEK</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

<link rel="stylesheet" href="/web/css/admin.css">

</head>

<body>

<div class="login-container">

<div class="card p-4 shadow login-card">

<div class="login-eyebrow mb-3">Admin Access</div>

<h4 class="text-center mb-2 fw-bold">LIXAFA Dashboard</h4>

<p class="text-center text-white-50 small mb-4">Masuk untuk mengelola produk, media, dan promo.</p>

<input type="text" id="username"
class="form-control mb-2"
placeholder="Username">

<input type="password" id="password"
class="form-control mb-3"
placeholder="Password">

<button onclick="login()" class="btn btn-dark w-100">
Login
</button>

<div id="msg" class="text-danger mt-2 text-center"></div>

</div>

</div>

<script src="/web/js/admin.js"></script>

</body>
</html>
